# Mai Launcher — CI
# Linse: Secrets niemals im Repo · schnelles Feedback · keine Nutzerdaten
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, Lint & APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Signierter Build nur bei Push auf main und nur mit gesetzten Secrets;
      # sonst wie bisher mit Debug-Schlüssel.
      SIGNED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Keystore und key.properties nur im Runner, nie im Repo oder Log.
      - name: Write signing config
        if: env.SIGNED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see README, Install)"
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > key.properties
          # Ab hier bricht Gradle ab, statt mit dem Debug-Schlüssel zu signieren.
          echo "REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"

      # ubuntu-latest bringt ANDROID_HOME mit.
      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Unit- und Oberflächentests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Lint
        run: ./gradlew :app:lintDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      # Release-Build mit R8; auf main mit Upload-Schlüssel, sonst Debug-Schlüssel.
      - name: Build APK
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk mai-launcher.apk
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Remove signing config
        if: always()
        run: rm -f key.properties "$RUNNER_TEMP/upload-keystore.jks"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mai-launcher.apk
          path: mai-launcher.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: app/build/reports
          retention-days: 7
