<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowS" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071018"/><stop offset="1" stop-color="#04070A"/></linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity="0.025"/></pattern>
</defs><rect width="1200" height="760" fill="#04070A"/><rect width="1200" height="760" fill="url(#scan)"/><text x="40" y="60" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="26" font-weight="700" fill="#E6F1F5" text-anchor="start" letter-spacing="3" opacity="1">DESIGN LANGUAGE · WORKING SHEET</text><text x="40" y="84" font-family="'Barlow','Liberation Sans',sans-serif" font-size="14" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Original system inspired by hand-terminal sci-fi: dark glass, one glowing frame, chamfered geometry, honest data.</text><text x="40" y="130" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#8AA4B0" text-anchor="start" letter-spacing="1.6" opacity="1">COLOUR TOKENS</text><path d="M40,144 L132,144 L140,152 L140,196 L48,196 L40,188 L40,144 Z" fill="#04070A" stroke="#1C2C35"/><text x="40" y="212" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Void · #04070A</text><path d="M152,144 L244,144 L252,152 L252,196 L160,196 L152,188 L152,144 Z" fill="#0A1218" stroke="#1C2C35"/><text x="152" y="212" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Panel · #0A1218</text><path d="M264,144 L356,144 L364,152 L364,196 L272,196 L264,188 L264,144 Z" fill="#1C2C35" stroke="#1C2C35"/><text x="264" y="212" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Line · #1C2C35</text><path d="M376,144 L468,144 L476,152 L476,196 L384,196 L376,188 L376,144 Z" fill="#E6F1F5" stroke="#1C2C35"/><text x="376" y="212" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Text · #E6F1F5</text><path d="M488,144 L580,144 L588,152 L588,196 L496,196 L488,188 L488,144 Z" fill="#8AA4B0" stroke="#1C2C35"/><text x="488" y="212" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Text 2 · #8AA4B0</text><path d="M40,236 L132,236 L140,244 L140,288 L48,288 L40,280 L40,236 Z" fill="#4CC9F0" stroke="#1C2C35"/><text x="40" y="304" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Ion (default) · #4CC9F0</text><path d="M152,236 L244,236 L252,244 L252,288 L160,288 L152,280 L152,236 Z" fill="#FFB547" stroke="#1C2C35"/><text x="152" y="304" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Amber · media/time</text><path d="M264,236 L356,236 L364,244 L364,288 L272,288 L264,280 L264,236 Z" fill="#5BE49B" stroke="#1C2C35"/><text x="264" y="304" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Signal green · comms</text><path d="M376,236 L468,236 L476,244 L476,288 L384,288 L376,280 L376,236 Z" fill="#FF4D5E" stroke="#1C2C35"/><text x="376" y="304" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Alert · only urgent</text><text x="640" y="130" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#8AA4B0" text-anchor="start" letter-spacing="1.6" opacity="1">TYPE</text><text x="640" y="186" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="64" font-weight="500" fill="#E6F1F5" text-anchor="start" letter-spacing="0" opacity="1">21:44</text><text x="800" y="160" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="12" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">DISPLAY · Barlow Condensed</text><text x="800" y="180" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="12" font-weight="500" fill="#4A606B" text-anchor="start" letter-spacing="0" opacity="1">clock, headers, labels</text><text x="640" y="220" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="12" font-weight="600" fill="#8AA4B0" text-anchor="start" letter-spacing="1.6" opacity="1">LABEL · CONDENSED CAPS +1.6</text><text x="640" y="248" font-family="'Barlow','Liberation Sans',sans-serif" font-size="17" font-weight="500" fill="#E6F1F5" text-anchor="start" letter-spacing="0" opacity="1">Body text stays sentence case and readable.</text><text x="640" y="274" font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="14" font-weight="500" fill="#4CC9F0" text-anchor="start" letter-spacing="0" opacity="1">1:42 / 4:03 · 82% · 06:30  — numbers in mono</text><text x="40" y="360" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#8AA4B0" text-anchor="start" letter-spacing="1.6" opacity="1">SHAPES</text><path d="M40,380 L176,380 L190,394 L190,470 L54,470 L40,456 L40,380 Z" fill="#0A1218" stroke="#4CC9F0" filter="url(#glowS)"/><text x="115" y="490" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="400" fill="#8AA4B0" text-anchor="middle" letter-spacing="0" opacity="1">Chamfer 45° (2 corners)</text><path d="M220,380 L360,380 L370,390 L370,470 L230,470 L220,460 L220,380 Z" fill="#0A1218" stroke="#1C2C35"/><rect x="220" y="380" width="3" height="16" fill="#4CC9F0"/><text x="232" y="395" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#8AA4B0" text-anchor="start" letter-spacing="1.6" opacity="1">PANEL</text><text x="295" y="490" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="400" fill="#8AA4B0" text-anchor="middle" letter-spacing="0" opacity="1">Panel + accent tick</text><polygon points="466.0,440.0 440.0,455.0 414.0,440.0 414.0,410.0 440.0,395.0 466.0,410.0" fill="#0E1A22" stroke="#4CC9F0" stroke-width="1.3" /><text x="440" y="433" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="20" font-weight="600" fill="#4CC9F0" text-anchor="middle" letter-spacing="0" opacity="1">AL</text><text x="440" y="490" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="400" fill="#8AA4B0" text-anchor="middle" letter-spacing="0" opacity="1">Hex = tappable token</text><path d="M518,405 L602,405 L610,413 L610,427 L510,427 L510,413 L518,405 Z" fill="#0E1A22" stroke="#4CC9F0"/><text x="524" y="421" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="12" font-weight="700" fill="#E6F1F5" text-anchor="start" letter-spacing="2" opacity="1">TITLE TAB</text><text x="560" y="490" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="400" fill="#8AA4B0" text-anchor="middle" letter-spacing="0" opacity="1">Tab = where am I</text><text x="640" y="360" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#8AA4B0" text-anchor="start" letter-spacing="1.6" opacity="1">GLOW BUDGET</text><path d="M640,380 L776,380 L790,394 L790,470 L654,470 L640,456 L640,380 Z" fill="#0A1218" stroke="#1C2C35" stroke-width="1" /><text x="715" y="490" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="400" fill="#8AA4B0" text-anchor="middle" letter-spacing="0" opacity="1">0 · resting</text><path d="M820,380 L956,380 L970,394 L970,470 L834,470 L820,456 L820,380 Z" fill="#0A1218" stroke="#4CC9F0" stroke-width="1" filter="url(#glowS)"/><text x="895" y="490" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="400" fill="#8AA4B0" text-anchor="middle" letter-spacing="0" opacity="1">1 · focus</text><path d="M1000,380 L1136,380 L1150,394 L1150,470 L1014,470 L1000,456 L1000,380 Z" fill="#0A1218" stroke="#4CC9F0" stroke-width="1.6" filter="url(#glow)"/><text x="1075" y="490" font-family="'Barlow','Liberation Sans',sans-serif" font-size="11" font-weight="400" fill="#8AA4B0" text-anchor="middle" letter-spacing="0" opacity="1">2 · active frame</text><text x="40" y="560" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="10" font-weight="600" fill="#8AA4B0" text-anchor="start" letter-spacing="1.6" opacity="1">CONTEXT COLOUR = WHERE YOU ARE (ONE ACCENT PER SCREEN)</text><path d="M40,576 L278,576 L290,588 L290,636 L52,636 L40,624 L40,576 Z" fill="#04070A" stroke="#4CC9F0" stroke-width="1.6" filter="url(#glow)"/><text x="60" y="612" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#4CC9F0" text-anchor="start" letter-spacing="2" opacity="1">DECK · INDEX · COMMAND</text><path d="M320,576 L558,576 L570,588 L570,636 L332,636 L320,624 L320,576 Z" fill="#04070A" stroke="#5BE49B" stroke-width="1.6" filter="url(#glow)"/><text x="340" y="612" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#5BE49B" text-anchor="start" letter-spacing="2" opacity="1">COMMS</text><path d="M600,576 L838,576 L850,588 L850,636 L612,636 L600,624 L600,576 Z" fill="#04070A" stroke="#FFB547" stroke-width="1.6" filter="url(#glow)"/><text x="620" y="612" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#FFB547" text-anchor="start" letter-spacing="2" opacity="1">MEDIA</text><path d="M880,576 L1118,576 L1130,588 L1130,636 L892,636 L880,624 L880,576 Z" fill="#04070A" stroke="#FF4D5E" stroke-width="1.6" filter="url(#glow)"/><text x="900" y="612" font-family="'Barlow Condensed','Arial Narrow',sans-serif" font-size="15" font-weight="700" fill="#FF4D5E" text-anchor="start" letter-spacing="2" opacity="1">ALERT ONLY</text><text x="40" y="690" font-family="'Barlow','Liberation Sans',sans-serif" font-size="13" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">Rules: glow is decoration, never the only carrier of meaning · text contrast ≥ 4.5:1 without glow · one glowing frame per screen · no fake data, every label is real</text><text x="40" y="714" font-family="'Barlow','Liberation Sans',sans-serif" font-size="13" font-weight="500" fill="#8AA4B0" text-anchor="start" letter-spacing="0" opacity="1">High-contrast mode: glow off, strokes 2 px, panels opaque · Reduce motion: no scan/draw-in, instant fades</text></svg>